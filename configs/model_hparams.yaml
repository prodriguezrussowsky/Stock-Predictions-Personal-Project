# Model Hyperparameters Configuration

xgboost:
  # Default parameters
  default:
    objective: reg:squarederror
    booster: gbtree
    eta: 0.1
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_estimators: 100
    early_stopping_rounds: 10
    eval_metric: rmse
  
  # Optimized for different horizons
  1d:
    eta: 0.2
    max_depth: 4
    n_estimators: 50
    subsample: 0.9
  
  5d:
    eta: 0.1
    max_depth: 6
    n_estimators: 100
    subsample: 0.8
  
  20d:
    eta: 0.05
    max_depth: 8
    n_estimators: 200
    subsample: 0.7
  
  # Hyperparameter search space
  search_space:
    eta: [0.01, 0.05, 0.1, 0.2, 0.3]
    max_depth: [3, 4, 5, 6, 7, 8, 9]
    min_child_weight: [1, 2, 3, 4, 5]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]
    reg_alpha: [0, 0.01, 0.1, 1, 10]
    reg_lambda: [0.1, 1, 10, 100]
    n_estimators: [50, 100, 200, 300, 500]

lstm:
  default:
    sequence_length: 60
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    patience: 10
  
  1d:
    sequence_length: 30
    hidden_size: 64
    num_layers: 1
  
  5d:
    sequence_length: 60
    hidden_size: 128
    num_layers: 2
  
  20d:
    sequence_length: 120
    hidden_size: 256
    num_layers: 3

prophet:
  default:
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    holidays_prior_scale: 10.0
    seasonality_mode: additive
    weekly_seasonality: true
    yearly_seasonality: true
    daily_seasonality: false
    interval_width: 0.8
  
  1d:
    changepoint_prior_scale: 0.1
    daily_seasonality: true
  
  5d:
    changepoint_prior_scale: 0.05
    weekly_seasonality: true
  
  20d:
    changepoint_prior_scale: 0.01
    seasonality_prior_scale: 15.0

baseline:
  sma:
    windows: [5, 10, 20, 50]
    default_window: 20
  
  ema:
    spans: [5, 10, 20, 50]
    default_span: 20
  
  linear_trend:
    fit_intercept: true
  
  volatility_adjusted:
    base_model: sma
    window: 20
    vol_window: 20